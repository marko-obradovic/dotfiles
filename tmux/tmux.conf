# True color + proper terminal
set -g default-terminal "tmux-256color"
set -g terminal-overrides ',*:Tc'
set -g status-position top

set -g base-index 1              # start indexing windows at 1 instead of 0
set -g detach-on-destroy off     # don't exit from tmux when closing a session
set -g escape-time 0             # zero-out escape time delay
set -g history-limit 1000000     # increase history size (from 2,000)
set -g renumber-windows on       # renumber all windows when any window is closed
set -g set-clipboard on          # use system clipboard
set -g default-terminal "${TERM}"
setw -g mode-keys vi
set -g pane-active-border-style 'fg=orange,bg=default'
set -g pane-border-style 'fg=brightblack,bg=default'

set -g @floax-width '80%'
set -g @floax-height '80%'
set -g @floax-border-color 'orange'
set -g @floax-text-color 'orange'
set -g @floax-bind 'p'
set -g @floax-change-path 'true'
set -g @sessionx-bind-zo-new-window 'ctrl-y'
set -g @sessionx-auto-accept 'off'
set -g @sessionx-bind 'o'
set -g @sessionx-window-height '85%'
set -g @sessionx-window-width '75%'
set -g @sessionx-zoxide-mode 'on'
set -g @sessionx-custom-paths-subdirectories 'false'
set -g @sessionx-filter-current 'false'

# Statusline config
set -g @window_left_separator ""
set -g @window_right_separator " "
set -g @window_middle_separator " █"
set -g @window_number_position "right"
set -g @window_default_fill "number"
set -g @window_default_text "#W"
set -g @window_current_fill "number"
set -g @window_current_text "#W#{?window_zoomed_flag,(),}"
set -g @status_modules_right "date_time"
set -g @status_modules_left "session"
set -g @status_left_separator  " "
set -g @status_right_separator " "
set -g @status_right_separator_inverse "no"
set -g @status_fill "icon"
set -g @status_connect_separator "no"
set -g @directory_text "#{b:pane_current_path}"
set -g @meetings_text "#($HOME/.config/tmux/scripts/cal.sh)"
set -g @date_time_text "%H:%M"

bind-key -T copy-mode-vi C-h select-pane -L
bind-key -T copy-mode-vi C-j select-pane -D
bind-key -T copy-mode-vi C-k select-pane -U
bind-key -T copy-mode-vi C-l select-pane -R
bind-key -T copy-mode-vi C-\ select-pane -l

# switch between panes using vim keybindings: ctrl + h/j/k/l
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

run-shell ~/.config/tmux/statusline/statusline.tmux
set -g automatic-rename on
set -g automatic-rename-format "#{b:pane_current_path}"
